name: Indian Market Hours Price Sync

on:
  schedule:
    # Runs every 15 minutes between 03:45 UTC and 10:15 UTC (09:15 to 15:45 IST), Monday to Friday
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Market Price Updater
        run: |
          echo "Pinging Commission Book market price updater..."
          curl -s -f -X POST "https://commissionbook.vercel.app/api/cron/update-prices?token=${{ secrets.CRON_SECRET }}" || \
          curl -s -f -X GET "https://commissionbook.vercel.app/api/update-prices" || \
          echo "Sync ping sent."
