name: Indian Market Hours Price Sync

on:
  schedule:
    # Runs every 15 minutes between 03:45 UTC and 10:15 UTC (09:15 to 15:45 IST), Monday to Friday
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Market Price Updater
        env:
          # Set the repository variable to https://aldervain.vercel.app once the alias is active.
          UPDATER_ORIGIN: ${{ vars.PUBLIC_BASE_URL || 'https://aldervain.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --request POST --header "Authorization: Bearer ${CRON_SECRET}" \
            "${UPDATER_ORIGIN%/}/api/cron/update-prices"
